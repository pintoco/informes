# ============================================================
# Elemental Pro — Stack 100% local (sin AWS)
# SeaweedFS = S3 (MinIO ya no publica imágenes Docker) | Redis+BullMQ = cola
# Uso: docker compose -f docker-compose.local.yml up --build
# ============================================================

services:

  db:
    image: postgres:15-alpine
    container_name: elemental_db_local
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: elemental_pro
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d elemental_pro"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - elemental_local

  # S3 compatible para desarrollo (sin autenticación: solo uso local)
  s3:
    image: chrislusf/seaweedfs:latest
    container_name: elemental_s3_local
    restart: unless-stopped
    command: server -dir=/data -s3 -s3.port=8333
    ports:
      - "8333:8333"
    volumes:
      - s3_data:/data
    networks:
      - elemental_local

  redis:
    image: redis:7-alpine
    container_name: elemental_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - elemental_local

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: elemental_migrate_local
    command: npx prisma migrate deploy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/elemental_pro
    depends_on:
      db:
        condition: service_healthy
    networks:
      - elemental_local

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: elemental_backend_local
    restart: unless-stopped
    ports:
      - "3001:3001"
    environment:
      NODE_ENV: development
      PORT: 3001
      DATABASE_URL: postgresql://postgres:postgres@db:5432/elemental_pro
      JWT_SECRET: local-dev-secret-please-change-in-production
      JWT_EXPIRES_IN: 24h
      TRUST_PROXY: 0
      # SeaweedFS como S3 (credenciales de relleno: el S3 local no las exige)
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      S3_ENDPOINT: http://s3:8333
      S3_PUBLIC_ENDPOINT: http://localhost:8333
      S3_FORCE_PATH_STYLE: "true"
      S3_BUCKET_PHOTOS: elemental-photos
      S3_BUCKET_PDFS: elemental-pdfs
      # Redis como cola
      REDIS_URL: redis://redis:6379
      # CORS
      CORS_ORIGIN: http://localhost:5173
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      s3:
        condition: service_started
    networks:
      - elemental_local

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: elemental_frontend_local
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: http://backend:3001
      VITE_API_URL: /api
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
      - ./frontend/vite.config.ts:/app/vite.config.ts
      - ./frontend/tailwind.config.ts:/app/tailwind.config.ts
      - ./frontend/postcss.config.js:/app/postcss.config.js
    depends_on:
      - backend
    networks:
      - elemental_local

volumes:
  postgres_data_local:
  s3_data:
  redis_data:

networks:
  elemental_local:
    driver: bridge
