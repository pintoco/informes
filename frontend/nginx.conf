server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1000;

    # La Content-Security-Policy la agrega el proxy (Caddy en Lightsail), porque depende
    # de dónde se sirven la API y los archivos (S3) en cada despliegue.

    # Cache assets estáticos compilados por Vite (tienen hash en el nombre)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback — todas las rutas sirven index.html
    location / {
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(), microphone=()" always;
        # index.html nunca se cachea para que los deploys se vean de inmediato
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
